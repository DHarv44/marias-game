:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F8ECF2; --bg2:#EED7E3; --panel:#FFF8FB; --ink:#4A2340; --muted:#7A4A66; --line:rgba(74,35,64,.14);
  --accent:#8C3F6A; --frame:#E7C9D8; --pink:#D9468A; --gold:#E59A3A; --violet:#9562D2;
  --display:'Rozha One',Georgia,serif; --ui:'Mulish',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;position:relative;background:var(--bg);color:var(--ink);font-family:var(--ui);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.screen.show{display:flex}
.display{font-family:var(--display);font-weight:400}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:26px;
  background:var(--panel);color:var(--ink);font-weight:800;font-size:17px;border:1.5px solid var(--frame);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFF8FB}
.btn.big{min-height:68px;flex-direction:column;gap:0;font-size:22px;font-family:var(--display);font-weight:400}
.btn.big small{font-family:var(--ui);font-size:13px;font-weight:700;opacity:.85}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.ibtn{width:44px;height:44px;flex:none;border-radius:50%;background:var(--panel);border:1.5px solid var(--frame);display:grid;place-items:center;color:var(--accent)}
.ibtn svg{width:18px;height:18px}

/* Home */
#home{justify-content:center;overflow:hidden}
.home-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;width:min(330px,86vw)}
.emblem{display:flex;justify-content:center;margin-bottom:2px}
.emblem svg{width:190px;height:190px}
.home-inner h1{margin:0 0 12px;text-align:center;font-family:var(--display);font-weight:400;font-size:48px;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.surprise{position:fixed;inset:0;z-index:60;background:var(--sb);color:var(--si);display:grid;place-items:center;overflow:hidden;animation:spJolt .5s cubic-bezier(.3,1.8,.5,1)}
.surprise.out{animation:spOut .45s ease-in forwards}
.sp-bg{position:absolute;inset:0;background-size:120px 120px;opacity:.9;animation:spDrift 6s linear infinite}
.sp-in{position:relative;text-align:center;padding:0 24px}
.sp-burst{position:relative;width:140px;height:140px;margin:0 auto 10px}
.sp-hero{position:absolute;inset:0;width:140px;height:140px;animation:spHero .9s cubic-bezier(.2,1.6,.4,1) both}
.sp-bit{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;opacity:0;animation:spBit 1.4s cubic-bezier(.15,.8,.3,1) forwards}
.sp-flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:spFlash .5s ease-out forwards}
.sp-ring{position:absolute;left:50%;top:0;width:140px;height:140px;margin-left:-70px;border-radius:50%;border:6px solid var(--sa);opacity:0;animation:spRing .8s .08s ease-out}
.sp-name{font-family:var(--display);font-size:clamp(34px,10vw,52px);line-height:1.05;margin:6px 0 8px;animation:spUp .55s .4s both}
.sp-line{font:600 15px var(--ui);opacity:.85;max-width:300px;margin:0 auto;animation:spUp .55s .55s both}
@keyframes spJolt{0%{opacity:0;transform:scale(1.18)}35%{opacity:1;transform:scale(.97) rotate(-1.2deg)}60%{transform:scale(1.02) rotate(.8deg)}100%{transform:none}}
@keyframes spFlash{0%{opacity:.95}100%{opacity:0}}
@keyframes spRing{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
@keyframes spOut{to{opacity:0;transform:scale(.96)}}
@keyframes spDrift{to{background-position:120px 60px}}
@keyframes spHero{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spBit{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r))}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bonusb{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;padding:0;border:2px solid var(--fa);background:var(--fb);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;z-index:2}
.bonusb img,.bonusb svg{width:28px;height:28px}
.bonusb i{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;color:#E59A3A;letter-spacing:-.5px;white-space:nowrap}
.bonusb.shut{border:2px dashed #C9A0B8;background:#F8EEF3;filter:grayscale(1);opacity:.45;cursor:default}
.bonusb:not(.got):not(.shut){animation:bonuspulse 2.4s ease-in-out infinite}
@keyframes bonuspulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fa) 40%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--fa) 0%,transparent)}}
.btn.fest{min-height:46px;padding:6px 16px;background:var(--fb);color:var(--fi);border:2px dashed var(--fa);display:flex;flex-direction:column;align-items:center;gap:2px}
.btn.fest.on{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--fa) 25%,transparent)}
.btn.fest small{font-size:11px;opacity:.8;font-weight:700}
.fstars{color:#E59A3A;margin-left:.4em;letter-spacing:.05em}
.toggles{display:flex;gap:8px;justify-content:center;margin-top:2px}
.tgl{padding:9px 14px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:700;color:var(--muted)}
.tgl b{color:var(--ink)}
.toran{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}

/* Map */
.bar{width:100%;max-width:520px;display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;z-index:2;background:var(--bg)}
.bar h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;flex:1;line-height:1}
.bar .total{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--frame);font-weight:800;font-size:15px}
.tree-scroll{width:100%;max-width:520px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.tree{position:relative;width:100%}
.tree svg.trunk{position:absolute;left:0;top:0}
.leaf{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center}
.leaf.locked{pointer-events:none}
.leaf .num{font-weight:800;font-size:14px}
.leaf.current{background:var(--panel);border:3px solid var(--pink);box-shadow:0 0 0 6px rgba(217,70,138,.15)}
.bough{position:absolute;transform:translate(-50%,-50%);padding:6px 14px;border-radius:999px;font-family:var(--display);font-size:17px;white-space:nowrap;border:1.5px dotted currentColor;line-height:1.1}
.mapdog{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--panel);display:grid;place-items:center;border:1.5px solid var(--pink)}
.mapdog.unmet{background:transparent;border:1.5px dashed #C9A0B8}
.pin{position:absolute;width:36px;height:46px;margin:-62px 0 0 -18px;pointer-events:none}
.map-foot{width:100%;max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 16px 14px;background:var(--bg);border-top:1px solid var(--line)}
.map-foot .btn{flex:1}
.dogrow{display:flex;gap:4px}
.dogrow .d{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1.5px solid var(--frame);display:grid;place-items:center}
.dogrow .d.unmet{background:transparent;border-style:dashed;border-color:#C9A0B8}

/* Game (variables are re-pointed per branch) */
#game{background-color:var(--bg);background-repeat:repeat;background-size:120px 120px}
.hud{width:100%;max-width:520px;display:grid;grid-template-columns:48px 1fr 72px;align-items:center;gap:8px;padding:10px 14px 2px}
.titlebox{text-align:center;line-height:1.05}
.titlebox .k{font-size:13px;font-weight:800;color:var(--muted)}
.titlebox b{display:block;font-family:var(--display);font-weight:400;font-size:28px}
.moves{width:66px;height:66px;border-radius:50%;background:var(--panel);border:2px dotted var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.moves b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.moves span{font-size:11px;font-weight:800;color:var(--muted)}
.moves.low b{color:#C23C4E;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.goalrow{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 14px 0}
.goals{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.goal{display:flex;align-items:center;gap:5px;padding:3px 11px 3px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--frame);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.goal img{width:26px;height:26px}
.goal.done{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.goal.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.14)}}
.scorebox{text-align:right;line-height:1}
.scorebox .k{font-size:11px;font-weight:800;color:var(--muted)}
.scorebox b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.sbar{position:relative;width:96px;height:6px;border-radius:3px;background:var(--bg2);margin-top:12px}
.sbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent);width:0;transition:width .35s}
.sbar .st{position:absolute;top:-13px;font-size:11px;transform:translateX(-50%);color:var(--line);line-height:1}
.sbar .st.on{color:var(--gold)}
#boardWrap{position:relative;flex:1;min-height:0;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;padding:6px}
.frame{position:relative;padding:5px;border-radius:26px;border:3px dotted var(--accent)}
.frame-in{border-radius:20px;border:1.5px solid var(--accent);background:var(--panel);padding:3px}
.paisley{position:absolute;width:30px;height:30px;pointer-events:none;color:var(--accent)}
.paisley.tl{left:-13px;top:-13px}.paisley.tr{right:-13px;top:-13px;transform:scaleX(-1)}
.paisley.bl{left:-13px;bottom:-13px;transform:scaleY(-1)}.paisley.br{right:-13px;bottom:-13px;transform:scale(-1,-1)}
#board{touch-action:none;display:block}
.callout{position:absolute;left:50%;top:44%;pointer-events:none;font-family:var(--display);font-size:38px;white-space:nowrap;opacity:0;
  transform:translate(-50%,-50%);text-shadow:0 2px 0 var(--panel),0 -2px 0 var(--panel),2px 0 0 var(--panel),-2px 0 0 var(--panel)}
.callout.go{animation:callout .95s ease-out}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}35%{transform:translate(-50%,-50%) scale(1)}
  75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}
.cheer{position:absolute;pointer-events:none;font-family:var(--display);font-size:34px;line-height:1.1;white-space:nowrap;z-index:6;opacity:0;
  transform:translate(-50%,-50%) scale(.45);will-change:transform,opacity;
  text-shadow:0 2px 0 var(--panel),0 -2px 0 var(--panel),2px 0 0 var(--panel),-2px 0 0 var(--panel),0 4px 10px rgba(0,0,0,.12)}
.cheer .x{font-family:var(--ui);font-weight:800;font-size:.6em;margin-left:.25em;vertical-align:.3em}
.banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none;text-align:center;opacity:0;
  font-family:var(--display);font-size:38px;padding:12px 0;background:var(--accent);color:var(--panel)}
.banner.go{animation:banner 1.3s ease-in-out}
@keyframes banner{0%{opacity:0;clip-path:inset(50% 0)}15%{opacity:1;clip-path:inset(0 0)}80%{opacity:1;clip-path:inset(0 0)}100%{opacity:0;clip-path:inset(50% 0)}}
.toolhint{min-height:20px;font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.dock{width:100%;max-width:520px;min-height:64px;display:flex;align-items:flex-end;gap:10px;padding:2px 14px 12px}

.dogbtn{position:relative;width:46px;height:46px;flex:none;border-radius:50%;background:var(--panel);border:1.5px solid var(--frame);display:grid;place-items:center}
.dogbtn svg{width:40px;height:40px}
.dogbtn .chg{position:absolute;right:-1px;top:-1px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--panel)}
.dogbtn.spent{opacity:.4}.dogbtn.spent .chg{display:none}
.dogbtn .treat{display:none;position:absolute;right:-4px;top:-4px}.dogbtn.canTreat{opacity:.75}.dogbtn.canTreat .treat{display:block}
.treats{align-self:center;display:flex;align-items:center;gap:4px;font:800 13px var(--ui);color:var(--muted)}
.help .row>svg{flex:none;width:34px;height:34px}
.dogbtn.sel{border:3px solid var(--pink);box-shadow:0 0 0 5px rgba(217,70,138,.18)}

.fluxrow{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;padding:0 14px 6px}
.fluxrow .lbl{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;min-width:36px}
.fbar{flex:1;height:10px;border-radius:5px;background:var(--bg2);overflow:hidden}

.tilts{display:flex;gap:4px}

.tilts button svg{width:15px;height:15px}
.tilts.ready button{opacity:1;background:var(--accent);color:var(--panel);border-color:var(--accent);animation:ready 1.5s ease-in-out infinite}
.tilts button.cur{box-shadow:inset 0 0 0 2px var(--muted)}
.tilts button.deny{animation:deny .3s}
@keyframes ready{50%{transform:translateY(-3px)}}
@keyframes deny{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(40,20,40,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal.show{display:flex}
.card{position:relative;width:min(360px,100%);max-height:100%;overflow-y:auto;background:#FFF8FB;color:#4A2340;border-radius:28px;padding:26px 20px 20px;
  border:3px dotted #8C3F6A;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:cardIn .25s ease-out;text-align:center}
@keyframes cardIn{from{transform:translateY(16px) scale(.96);opacity:0}}

.mbody{margin:14px 0 18px;font-size:15px;line-height:1.45}
.mbtns{display:flex;flex-direction:column;gap:10px}
.card .btn{border-color:#E7C9D8;background:#FFF8FB;color:#4A2340}
.card .btn.primary{background:#8C3F6A;border-color:#8C3F6A;color:#FFF8FB}

.glist{display:flex;flex-direction:column;gap:8px;text-align:left}
.gl{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:#F6E4EE;font-weight:800}
.gl img{width:32px;height:32px;flex:none}
.tip.slate{background:#2F4A3F;color:#F4F1E8;border:5px solid #9C6B3E;border-radius:10px;font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.01em}
.tip{margin-top:12px;padding:10px 12px;border-radius:16px;border:1.5px dashed #D9B5C9;color:#6E4560;font-size:14px;font-weight:600;text-align:left}
.stars{display:flex;justify-content:center;gap:10px;font-size:52px;line-height:1;margin:6px 0 4px}
.stars span{color:#EED7E3}

@keyframes starIn{from{transform:scale(.2) rotate(-40deg)}}
.big-score{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.hero{display:flex;justify-content:center;gap:8px;margin:4px 0 10px}
.swatches{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}

.motif-tile{height:90px;border-radius:18px;margin-top:10px;background-size:120px 120px}
.help{text-align:left;display:flex;flex-direction:column;gap:12px}
.help .row{display:flex;gap:12px;align-items:center}
.help img{width:40px;height:40px;flex:none}
.help p{margin:0;font-size:14px;line-height:1.38}
@media (prefers-reduced-motion: reduce){
  .tilts.ready button,.moves.low b{animation:none}
}
@media (max-height:660px){
  .moves{width:56px;height:56px}.moves b{font-size:24px}.emblem svg{width:130px;height:130px}.home-inner h1{font-size:40px}
}

<body>

<section id="home" class="screen show">
  <div class="toran" id="toran" aria-hidden="true"></div>
  <div class="home-inner">
    <div class="emblem" id="emblem"></div>
    <h1>Maria's Game</h1>
    <button class="btn primary big" id="btnContinue">Continue<small id="contLabel">Garden City</small></button>
    <button class="btn" id="btnTree">The tree</button>
    <div class="row2"><button class="btn" id="btnDaily">Today's leaf</button><button class="btn" id="btnEndless">Endless</button></div>
    <button class="btn ghost" id="btnHelp">How to play</button>
    <div class="toggles">
      <button class="tgl" id="tglSound">Sound <b>On</b></button>
      <button class="tgl" id="tglHaptic">Vibration <b>On</b></button>
    </div>
  </div>
</section>

<section id="map" class="screen">
  <div class="bar">
    <button class="ibtn" id="mapBack" aria-label="Back"></button>
    <h2>Maria's Journey</h2>
    <span class="total" id="starTotal"></span>
  </div>
  <div class="tree-scroll" id="treeScroll"><div class="tree" id="tree"></div></div>
  <div class="map-foot">
    <div class="dogrow" id="mapDogs"></div>
    <button class="btn primary" id="mapPlay">Play</button>
  </div>
</section>

<section id="game" class="screen">
  <header class="hud">
    <button class="ibtn" id="btnPause" aria-label="Pause"></button>
    <div class="titlebox"><span class="k" id="hudK">Garden City</span><b id="hudLevel">Level 1</b></div>
    <div class="moves" id="movesBox"><b id="hudMoves">20</b><span>moves</span></div>
  </header>
  <div class="goalrow">
    <div class="goals" id="goals"></div>
    <div class="scorebox"><span class="k">Score</span><br><b id="hudScore">0</b>
      <div class="sbar" id="sbar"><i id="sbarFill"></i><span class="st" id="st1">★</span><span class="st" id="st2">★</span><span class="st" id="st3">★</span></div>
    </div>
  </div>
  <div id="boardWrap">

      <div class="frame-in"><canvas id="board"></canvas></div>
    </div>

  <footer class="dock">

        <button data-dir="up" aria-label="Tilt up"></button>
        <button data-dir="down" aria-label="Tilt down"></button>
        <button data-dir="right" aria-label="Tilt right"></button>
      </div>
    </div>
  </footer>
</section>

<div id="modal" role="dialog" aria-modal="true"></div>

<script id="engine">
'use strict';
/* ====================== ENGINE (no DOM) ======================
   Deterministic: every gameplay draw comes from G.rng, seeded per level.
   Visual effects and hints may use Math.random; nothing that changes the board does. */
const DIRS={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]};
const SHAPE_COLORS=['#E0508E','#EE9F2E','#3FA88B','#5F84E2','#9562D2','#7FAE3E'];
const SHAPE_NAMES=['lotuses','marigolds','paisleys','moons','stars','leaves'];
const ENGINE_VERSION=2;
let PID=0;

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function makeRng(seed){
  let a=0x9E3779B9,b=0x243F6A88,c=0xB7E15162,d=seed>>>0;
  const r=()=>{a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);d=(d+1)|0;t=(t+d)|0;c=(c+t)|0;return (t>>>0)/4294967296;};
  for(let i=0;i<15;i++)r();
  return r;
}
function shuffleArr(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

class Piece{
  constructor(color,kind='normal'){
    this.id=++PID;this.color=color;this.kind=kind;this.hp=1;this.maxHp=1;this.part=0;this.mud=false;
    this.x=0;this.y=0;this.tx=0;this.ty=0;this.speed=0;this.accel=0;
    this.falling=false;this.land=0;this.pop=0;this.hit=0;this.activated=false;
  }
}
const isSpecial=p=>!!p&&(p.kind==='lineH'||p.kind==='lineV'||p.kind==='nova'||p.kind==='prism');
const movable=p=>!!p&&p.kind!=='boulder'&&p.kind!=='boss';

// UI hooks (no-ops by default so the engine runs headless)
const H={};
['sound','destroyed','beam','ring','rays','text','combo','banner','hud','shake','buzz','crack','crystal','special','gravity',
 'goalBump','shuffleFx','clearHint','armHint','win','lose','fishHome','bossFed','bossMove','bossThrash','bossLeap','patch','cheer','zoomies','leap','shadow','pupGo','tidy','sweep','snuggle'].forEach(k=>H[k]=()=>{});

const G={session:0,active:false,mode:'journey',level:null,cols:8,rows:8,
  valid:new Uint8Array(64),crystal:new Uint8Array(64),patch:new Uint8Array(64),cells:new Array(64).fill(null),
  gravity:'down',pendingGravity:null,moves:0,score:0,flux:0,goals:[],busy:false,combo:0,sel:-1,hint:null,
  instant:false,speed:1,continued:false,ended:false,colors:5,rng:Math.random,seed:0,
  boss:null,tools:{},fishSpawnLeft:0,pupSpawnLeft:0,pupQueue:[],shadowUsed:false};

const idx=(x,y)=>y*G.cols+x;
const xy=i=>[i%G.cols,(i/G.cols)|0];
const inb=(x,y)=>x>=0&&y>=0&&x<G.cols&&y<G.rows;
const randColor=()=>Math.floor(G.rng()*G.colors);
function neigh(i){const [x,y]=xy(i);const o=[];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&G.valid[idx(nx,ny)])o.push(idx(nx,ny));}return o;}
function adjacent(a,b){const [ax,ay]=xy(a),[bx,by]=xy(b);return Math.abs(ax-bx)+Math.abs(ay-by)===1;}
function colorAt(x,y){if(!inb(x,y))return -1;const i=idx(x,y);if(!G.valid[i])return -1;const p=G.cells[i];
  if(!p||p.kind==='boulder'||p.kind==='prism'||p.kind==='fish'||p.kind==='boss')return -1;return p.color;}
function centroid(cells){if(!cells.length)return [G.cols/2,G.rows/2];let sx=0,sy=0;for(const c of cells){const [x,y]=xy(c);sx+=x;sy+=y;}return [sx/cells.length,sy/cells.length];}

/* ---------- timing ---------- */
const settleWaiters=[];
function wait(ms){if(G.instant)return Promise.resolve();const s=G.session;return new Promise(r=>setTimeout(()=>{if(s===G.session)r();},ms/G.speed));}
function allSettled(){for(const p of G.cells)if(p&&(p.x!==p.tx||p.y!==p.ty))return false;return true;}
function waitSettled(){
  if(G.instant){for(const p of G.cells)if(p){p.x=p.tx;p.y=p.ty;p.falling=false;}return Promise.resolve();}
  return new Promise(r=>settleWaiters.push(r));
}
function stepMotion(dt){
  for(const p of G.cells){
    if(!p)continue;const dx=p.tx-p.x,dy=p.ty-p.y;if(dx===0&&dy===0)continue;
    const d=Math.hypot(dx,dy);p.speed=Math.min(22,p.speed+p.accel*dt);const s=p.speed*dt;
    if(s>=d){p.x=p.tx;p.y=p.ty;if(p.falling){p.falling=false;p.land=1;}p.speed=0;}
    else{p.x+=dx/d*s;p.y+=dy/d*s;}
  }
  if(settleWaiters.length&&allSettled()){const w=settleWaiters.splice(0);w.forEach(f=>f());}
}

/* ---------- board setup ----------
   Layout characters: x hole, . open, 1/2 ice, o/O rock (1 or 2 hits), f fish, p quilt patch */
function makesRun(x,y,c){return (colorAt(x-1,y)===c&&colorAt(x-2,y)===c)||(colorAt(x,y-1)===c&&colorAt(x,y-2)===c);}
function setupBoard(L,mode,seed){
  G.session++;settleWaiters.length=0;
  G.mode=mode;G.level=L;G.seed=seed>>>0;G.rng=makeRng(G.seed);
  G.cols=L.cols;G.rows=L.rows;const N=L.cols*L.rows;
  G.valid=new Uint8Array(N);G.crystal=new Uint8Array(N);G.patch=new Uint8Array(N);G.cells=new Array(N).fill(null);
  G.gravity=L.gravity;G.pendingGravity=null;G.moves=L.moves;G.score=0;G.flux=L.flux||0;G.busy=false;G.combo=0;G.sel=-1;G.hint=null;
  G.continued=false;G.ended=false;G.speed=1;G.colors=L.colors;G.tools=Object.assign({},L.tools||{});G.pupQueue=[];G.shadowUsed=false;
  G.boss=L.boss?{row:L.boss.row,x:L.boss.x,len:3,fed:0,need:L.boss.need,hunger:0,dir:1,turns:0,released:false,fedThisTurn:false}:null;
  const rocks=[],fish=[];
  for(let y=0;y<L.rows;y++)for(let x=0;x<L.cols;x++){
    const ch=L.layout[y][x],i=idx(x,y);if(ch==='x')continue;G.valid[i]=1;
    if(ch==='1')G.crystal[i]=1;if(ch==='2')G.crystal[i]=2;if(ch==='p')G.patch[i]=1;
    if(ch==='o'||ch==='O')rocks.push([i,ch==='O'?2:1]);
    if(ch==='f')fish.push(i);
  }
  let tries=0;
  do{
    G.cells.fill(null);
    for(const [i,hp] of rocks){const p=new Piece(-1,'boulder');p.hp=p.maxHp=hp;G.cells[i]=p;}
    if(G.boss)for(let k=0;k<3;k++){const p=new Piece(-1,'boss');p.part=k;G.cells[idx(G.boss.x+k,G.boss.row)]=p;}
    for(const i of fish)G.cells[i]=new Piece(-1,'fish');
    for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++){
      const i=idx(x,y);if(!G.valid[i]||G.cells[i])continue;
      let c,t=0;do{c=randColor();t++;}while(t<30&&makesRun(x,y,c));
      G.cells[i]=new Piece(c);
    }
    tries++;
  }while((findRuns().length||!findMove())&&tries<60);
  if(L.fish&&!fish.length){ // no hand-placed fish: start a few near the top
    const top=[];for(let y=0;y<2;y++)for(let x=0;x<G.cols;x++){const i=idx(x,y);const p=G.cells[i];if(p&&p.kind==='normal'&&colorAt(x,y)>=0)top.push(i);}
    for(const i of shuffleArr(top,G.rng).slice(0,Math.min(L.fish.max,L.fish.n))){const p=new Piece(-1,'fish');G.cells[i]=p;fish.push(i);}
  }
  G.fishSpawnLeft=L.fish?Math.max(0,L.fish.n-fish.length):0;
  G.pupSpawnLeft=L.pups?L.pups.n:0;
  if(L.pups&&L.pups.start){const spots=shuffleArr(G.cells.map((p,i)=>p&&p.kind==='normal'?i:-1).filter(i=>i>=0),G.rng).slice(0,L.pups.start);
    for(const i of spots){G.cells[i]=newPup();G.pupSpawnLeft--;}}
  G.goals=L.goals.map(g=>Object.assign({},g));
  for(const g of G.goals){
    if(g.t==='collect'||g.t==='score'||g.t==='fish')g.left=g.n;
    if(g.t==='crystal')g.left=G.crystal.reduce((a,v)=>a+(v>0?1:0),0);
    if(g.t==='boulder')g.left=G.cells.filter(p=>p&&p.kind==='boulder').length;
    if(g.t==='patch')g.left=G.patch.reduce((a,v)=>a+(v===1?1:0),0);
    if(g.t==='boss')g.left=G.boss?G.boss.need:0;
    g.total=g.left;
  }
  const [gx,gy]=DIRS[G.gravity];const span=(gx?G.cols:G.rows)+1;
  G.cells.forEach((p,i)=>{if(!p)return;const [x,y]=xy(i);p.tx=x;p.ty=y;const lane=gx?y:x;
    p.x=x-gx*(span+lane*0.35);p.y=y-gy*(span+lane*0.35);p.speed=0;p.accel=45;p.falling=true;});
}

/* ---------- matching ---------- */
function findRuns(){
  const runs=[];
  for(let y=0;y<G.rows;y++){let x=0;while(x<G.cols){const c=colorAt(x,y);if(c<0){x++;continue;}let e=x+1;while(e<G.cols&&colorAt(e,y)===c)e++;
    if(e-x>=3){const cells=[];for(let k=x;k<e;k++)cells.push(idx(k,y));runs.push({dir:'h',cells,color:c});}x=e;}}
  for(let x=0;x<G.cols;x++){let y=0;while(y<G.rows){const c=colorAt(x,y);if(c<0){y++;continue;}let e=y+1;while(e<G.rows&&colorAt(x,e)===c)e++;
    if(e-y>=3){const cells=[];for(let k=y;k<e;k++)cells.push(idx(x,k));runs.push({dir:'v',cells,color:c});}y=e;}}
  return runs;
}
function groupRuns(runs){
  const par=runs.map((_,i)=>i);const find=i=>par[i]===i?i:(par[i]=find(par[i]));
  const owner=new Map();
  runs.forEach((r,i)=>r.cells.forEach(c=>{if(owner.has(c))par[find(i)]=find(owner.get(c));else owner.set(c,i);}));
  const groups=new Map();
  runs.forEach((r,i)=>{const k=find(i);if(!groups.has(k))groups.set(k,{runs:[],cells:new Set(),color:r.color});const g=groups.get(k);g.runs.push(r);r.cells.forEach(c=>g.cells.add(c));});
  return [...groups.values()];
}
function decideSpecial(g,prefer){
  const maxLen=Math.max(...g.runs.map(r=>r.cells.length));
  const hasH=g.runs.some(r=>r.dir==='h'),hasV=g.runs.some(r=>r.dir==='v');
  let kind=null;
  if(maxLen>=5)kind='prism';else if(hasH&&hasV)kind='nova';else if(maxLen===4)kind=g.runs[0].dir==='h'?'lineV':'lineH';
  if(!kind)return null;
  let pos=prefer.find(c=>g.cells.has(c));
  if(pos===undefined&&hasH&&hasV){const hc=new Set(g.runs.filter(r=>r.dir==='h').flatMap(r=>r.cells));pos=g.runs.filter(r=>r.dir==='v').flatMap(r=>r.cells).find(c=>hc.has(c));}
  if(pos===undefined){const r=g.runs.reduce((a,b)=>b.cells.length>a.cells.length?b:a);pos=r.cells[Math.floor(r.cells.length/2)];}
  return {kind,pos,color:g.color};
}
function matchAt(i){
  const [x,y]=xy(i);const c=colorAt(x,y);if(c<0)return false;
  let n=1;for(let k=x-1;colorAt(k,y)===c;k--)n++;for(let k=x+1;colorAt(k,y)===c;k++)n++;if(n>=3)return true;
  n=1;for(let k=y-1;colorAt(x,k)===c;k--)n++;for(let k=y+1;colorAt(x,k)===c;k++)n++;return n>=3;
}
// Search start is random only to vary hints; whether a move exists never depends on it.
function findMove(){
  const N=G.cells.length;const start=Math.floor(Math.random()*N);
  for(let k=0;k<N;k++){
    const i=(start+k)%N;if(!G.valid[i]||!movable(G.cells[i]))continue;const [x,y]=xy(i);
    for(const [dx,dy] of [[1,0],[0,1]]){
      const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!G.valid[j]||!movable(G.cells[j]))continue;
      const a=G.cells[i],b=G.cells[j];
      if(a.kind==='prism'||b.kind==='prism'||(isSpecial(a)&&isSpecial(b)))return [i,j];
      G.cells[i]=b;G.cells[j]=a;const m=matchAt(i)||matchAt(j);G.cells[i]=a;G.cells[j]=b;
      if(m)return [i,j];
    }
  }
  return null;
}

/* ---------- gravity ---------- */
// Each line runs from the edge gravity points at (index 0) back to the far edge.
function lineList(){
  const g=G.gravity,out=[];
  if(g==='down'||g==='up'){for(let x=0;x<G.cols;x++){const L=[];
    if(g==='down'){for(let y=G.rows-1;y>=0;y--)if(G.valid[idx(x,y)])L.push(idx(x,y));}
    else{for(let y=0;y<G.rows;y++)if(G.valid[idx(x,y)])L.push(idx(x,y));}out.push(L);}}
  else{for(let y=0;y<G.rows;y++){const L=[];
    if(g==='right'){for(let x=G.cols-1;x>=0;x--)if(G.valid[idx(x,y)])L.push(idx(x,y));}
    else{for(let x=0;x<G.cols;x++)if(G.valid[idx(x,y)])L.push(idx(x,y));}out.push(L);}}
  return out;
}
const isFixed=i=>{const p=G.cells[i];return !!p&&p.kind==='boss';};
function fishOnBoard(){let n=0;for(const p of G.cells)if(p&&p.kind==='fish')n++;return n;}
function pupsOnBoard(){let n=0;for(const p of G.cells)if(p&&p.kind==='pup')n++;return n;}
function newPup(){const P=G.level.pups;const p=new Piece(-1,'pup');p.dog=P.dogs[Math.floor(G.rng()*P.dogs.length)];return p;}
function newPiece(){
  const U=G.level&&G.level.pups;
  if(U&&G.pupSpawnLeft>0&&pupsOnBoard()<U.max&&G.rng()<U.rate){G.pupSpawnLeft--;return newPup();}
  const F=G.level&&G.level.fish;
  if(F&&G.fishSpawnLeft>0&&fishOnBoard()<F.max&&G.rng()<F.rate){G.fishSpawnLeft--;return new Piece(-1,'fish');}
  return new Piece(randColor());
}
// The arapaima is fixed in place: pieces fall within the stretches above and below it.
function collapse(){
  const [gx,gy]=DIRS[G.gravity];
  for(const L of lineList()){
    const segs=[];let seg=[];
    for(const i of L){if(isFixed(i)){if(seg.length)segs.push(seg);seg=[];}else seg.push(i);}
    if(seg.length)segs.push(seg);
    for(const S of segs){
      const ps=S.map(i=>G.cells[i]).filter(Boolean);
      S.forEach(i=>G.cells[i]=null);
      ps.forEach((p,k)=>{const i=S[k];G.cells[i]=p;const [tx,ty]=xy(i);
        if(p.tx!==tx||p.ty!==ty){p.tx=tx;p.ty=ty;p.speed=Math.max(p.speed,2);p.accel=55;p.falling=true;}});
      const nNew=S.length-ps.length;
      for(let k=ps.length;k<S.length;k++){
        const i=S[k];const [tx,ty]=xy(i);const p=newPiece();
        p.tx=tx;p.ty=ty;p.x=tx-gx*nNew;p.y=ty-gy*nNew;p.speed=2;p.accel=55;p.falling=true;G.cells[i]=p;
      }
    }
  }
}

/* ---------- scoring / goals ---------- */
const mult=()=>Math.max(1,Math.min(G.combo,6));
function addFlux(n){if(!G.level||!G.level.gravityUnlocked)return;G.flux=Math.min(100,G.flux+n*(G.mode==='endless'?1.3:1));}
function goalTick(t,c){
  if(G.mode==='endless')return;
  G.goals.forEach((g,k)=>{if(g.t!==t)return;if(t==='collect'&&g.c!==c)return;if(g.left>0){g.left--;H.goalBump(k);if(g.left===0)H.cheer('goal',null);}});
}
function goalsMet(){return G.goals.every(g=>g.t==='score'?G.score>=g.n:g.t==='boss'?!!(G.boss&&G.boss.released):g.left<=0);}
function crackCrystal(i){G.crystal[i]--;G.score+=30;H.crystal(i,G.crystal[i]);if(G.crystal[i]===0)goalTick('crystal');}
function patchAt(i){if(G.patch[i]===1){G.patch[i]=2;G.score+=30;H.patch(i);goalTick('patch');}}
function fishScored(){goalTick('fish');G.score+=60;feedBoss(5);}
function collectFish(){
  let n=0;
  for(const L of lineList()){const i=L[0];if(i===undefined)continue;const p=G.cells[i];
    if(p&&p.kind==='fish'){G.cells[i]=null;H.fishHome(p,i);fishScored();n++;}}
  if(n)H.sound('splash');
  return n;
}
function destroyAt(i,opts){
  if(!G.valid[i])return;
  const p=G.cells[i];
  if(p&&p.kind==='boss'){feedBoss(2);return;}
  if(p&&p.kind==='pup'){G.cells[i]=null;G.pupQueue.push({dog:p.dog,i});H.pupGo(p,i);G.score+=50;if(G.crystal[i])crackCrystal(i);patchAt(i);return;}
  if(p&&p.kind==='fish'){
    if(opts&&(opts.spill||opts.fetch)){G.cells[i]=null;H.fishHome(p,i);fishScored();}
    return;
  }
  if(p&&p.kind==='boulder'){
    p.hp--;
    if(p.hp>0&&!(opts&&opts.spill)){p.hit=1;G.score+=20;H.crack(i,p,false);return;}
    G.cells[i]=null;H.crack(i,p,true);H.destroyed(p,i,opts);if(!p.mud)goalTick('boulder');G.score+=p.mud?20:80;
    if(G.crystal[i])crackCrystal(i);
    patchAt(i);
    return;
  }
  if(p){G.cells[i]=null;H.destroyed(p,i,opts);if(p.color>=0)goalTick('collect',p.color);G.score+=10*mult();}
  if(G.crystal[i])crackCrystal(i);
  patchAt(i);
}

// Fish swim: after each move every fish slips one cell toward the pond, trading places with the shape below.
function fishSwim(){
  let moved=false;
  for(const L of lineList())for(let k=1;k<L.length;k++){
    const i=L[k],j=L[k-1];const p=G.cells[i],q=G.cells[j];
    if(!p||p.kind!=='fish'||!q||q.kind!=='normal'||isFixed(j))continue;
    G.cells[i]=q;G.cells[j]=p;const [qx,qy]=xy(i),[px,py]=xy(j);
    q.tx=qx;q.ty=qy;q.speed=3;q.accel=10;p.tx=px;p.ty=py;p.speed=3;p.accel=10;moved=true;k++;
  }
  return moved;
}

/* ---------- the arapaima ---------- */
function bossCells(){const B=G.boss;if(!B||B.released)return [];const o=[];for(let k=0;k<B.len;k++)o.push(idx(B.x+k,B.row));return o;}
function nearBoss(i){const bc=bossCells();return bc.length>0&&neigh(i).some(n=>bc.includes(n));}
function feedBoss(n){
  const B=G.boss;if(!B||B.released||n<=0)return;
  B.fed=Math.min(B.need,B.fed+n);B.fedThisTurn=true;
  G.goals.forEach((g,k)=>{if(g.t==='boss'){const left=B.need-B.fed;if(left!==g.left){g.left=left;H.goalBump(k);}}});
  H.bossFed(n);
}
function moveBoss(){
  const B=G.boss;
  for(let attempt=0;attempt<2;attempt++){
    const lead=B.dir>0?B.x+B.len:B.x-1;
    const li=lead>=0&&lead<G.cols?idx(lead,B.row):-1;
    if(li>=0&&G.valid[li]&&movable(G.cells[li])){
      const tail=B.dir>0?idx(B.x,B.row):idx(B.x+B.len-1,B.row);
      const displaced=G.cells[li];const parts=bossCells().map(i=>G.cells[i]);
      B.x+=B.dir;
      bossCells().forEach((i,k)=>{G.cells[i]=parts[k];const [x,y]=xy(i);parts[k].tx=x;parts[k].ty=y;parts[k].speed=1.5;parts[k].accel=3;});
      G.cells[tail]=displaced;const [tx,ty]=xy(tail);displaced.tx=tx;displaced.ty=ty;displaced.speed=3;displaced.accel=6;
      H.bossMove();return true;
    }
    B.dir*=-1;
  }
  return false;
}
function thrash(){
  const cand=[];G.cells.forEach((p,i)=>{if(p&&p.kind==='normal')cand.push(i);});
  const picks=shuffleArr(cand,G.rng).slice(0,3);
  for(const i of picks){const p=new Piece(-1,'boulder');p.mud=true;p.pop=1;const [x,y]=xy(i);p.x=p.tx=x;p.y=p.ty=y;G.cells[i]=p;}
  H.bossThrash(picks);
}
async function releaseBoss(){
  const B=G.boss;const cells=bossCells();
  H.bossLeap(cells.map(i=>G.cells[i]));
  cells.forEach(i=>{G.cells[i]=null;});
  B.released=true;G.score+=500;H.cheer('boss',cells);
  G.goals.forEach((g,k)=>{if(g.t==='boss'){g.left=0;H.goalBump(k);}});
  await wait(700);collapse();await waitSettled();await cascade();
}
async function bossTurn(){
  const B=G.boss;if(!B||B.released)return;
  if(B.fed>=B.need){await releaseBoss();return;}
  B.turns++;
  B.hunger=B.fedThisTurn?0:B.hunger+1;B.fedThisTurn=false;
  if(B.hunger>=3){B.hunger=0;thrash();await wait(250);}
  if(B.turns%2===0&&moveBoss()){await waitSettled();if(findRuns().length)await cascade();}
}

/* ---------- specials ---------- */
function rowCells(y){const o=[];if(y<0||y>=G.rows)return o;for(let x=0;x<G.cols;x++)if(G.valid[idx(x,y)])o.push(idx(x,y));return o;}
function colCells(x){const o=[];if(x<0||x>=G.cols)return o;for(let y=0;y<G.rows;y++)if(G.valid[idx(x,y)])o.push(idx(x,y));return o;}
function diamond(cx,cy,r){const o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)+Math.abs(dy)>r)continue;const x=cx+dx,y=cy+dy;if(inb(x,y)&&G.valid[idx(x,y)])o.push(idx(x,y));}return o;}
function cellsOfColor(c,exclude){const o=[];G.cells.forEach((p,i)=>{if(p&&p!==exclude&&p.color>=0&&(p.kind==='normal'||isSpecial(p))&&p.kind!=='prism'&&!p.activated&&p.color===c)o.push(i);});return o;}
function mostCommonColor(){const cnt=new Array(6).fill(0);G.cells.forEach(p=>{if(p&&p.color>=0&&p.kind!=='prism'&&!p.activated)cnt[p.color]++;});let b=0;for(let c=1;c<6;c++)if(cnt[c]>cnt[b])b=c;return b;}
function effectCells(p,i){
  const [x,y]=xy(i);
  if(p.kind==='lineH'){H.beam(x,y,'h',p.color);H.sound('beam');return rowCells(y);}
  if(p.kind==='lineV'){H.beam(x,y,'v',p.color);H.sound('beam');return colCells(x);}
  if(p.kind==='nova'){H.ring(x,y,2.6,p.color);H.sound('nova');H.shake(6);return diamond(x,y,2);}
  if(p.kind==='prism'){const c=mostCommonColor();const t=cellsOfColor(c);H.rays(i,t,c);H.sound('prism');return t;}
  return [];
}
const SPECIAL_BONUS={lineH:60,lineV:60,nova:100,prism:200};
function placeSpecial(s){
  const p=new Piece(s.kind==='prism'?-1:s.color,s.kind);const [x,y]=xy(s.pos);
  p.x=p.tx=x;p.y=p.ty=y;p.pop=1;G.cells[s.pos]=p;G.score+=SPECIAL_BONUS[s.kind];addFlux(8);H.special(p,s.pos);H.cheer(s.kind==='prism'?'prism':s.kind==='nova'?'nova':'beam',[s.pos]);
}
async function blast(initial,spawns=[],opts=null){
  let wave=new Set(initial.filter(i=>G.valid[i]));
  if(!wave.size)return;
  const done=new Set();let first=true;const s0=G.score;const center=centroid([...wave]);
  while(wave.size){
    wave.forEach(i=>done.add(i));
    const next=new Set();
    for(const i of wave){const p=G.cells[i];if(isSpecial(p)&&!p.activated){p.activated=true;addFlux(4);
      for(const c of effectCells(p,i))if(!done.has(c))next.add(c);}}
    for(const i of wave)destroyAt(i,opts);
    if(first){first=false;for(const s of spawns)placeSpecial(s);}
    opts=null;wave=next;
    if(wave.size)await wait(140);
  }
  const gained=G.score-s0;if(gained>0)H.text('+'+gained,center);
  H.hud();
}
async function comboSwap(a,b){
  const P=G.cells[b],Q=G.cells[a];const [cx,cy]=xy(b);H.cheer('combo',[a,b]);
  if(P.kind==='prism'&&Q.kind==='prism'){
    P.activated=Q.activated=true;H.sound('mega');H.shake(16);H.ring(cx,cy,10,null);addFlux(30);
    const all=[];for(let i=0;i<G.cells.length;i++)if(G.valid[i])all.push(i);
    await wait(200);await blast(all);return;
  }
  if(P.kind==='prism'||Q.kind==='prism'){
    const pi=P.kind==='prism'?b:a,oi=pi===b?a:b;const prism=G.cells[pi],other=G.cells[oi];
    prism.activated=true;
    if(other.color<0){await wait(200);await blast([pi,oi]);return;}
    const c=other.color;const targets=cellsOfColor(c,other);
    H.rays(pi,targets.concat(oi),c);H.sound('prism');addFlux(15);
    if(other.kind==='normal'){await wait(300);await blast([pi,oi,...targets]);return;}
    for(const i of targets){const p=G.cells[i];if(p.kind==='normal'){p.kind=other.kind==='nova'?'nova':(G.rng()<.5?'lineH':'lineV');p.pop=1;}}
    H.sound('forge');await wait(550);await blast([pi,oi,...targets]);return;
  }
  P.activated=Q.activated=true;addFlux(12);
  const isLine=k=>k==='lineH'||k==='lineV';const set=new Set([a,b]);
  const addRow=y=>{const r=rowCells(y);if(r.length){r.forEach(i=>set.add(i));H.beam(cx,y,'h',P.color);}};
  const addCol=x=>{const c=colCells(x);if(c.length){c.forEach(i=>set.add(i));H.beam(x,cy,'v',Q.color);}};
  if(isLine(P.kind)&&isLine(Q.kind)){addRow(cy);addCol(cx);H.sound('beam');H.shake(8);}
  else if(P.kind==='nova'&&Q.kind==='nova'){diamond(cx,cy,4).forEach(i=>set.add(i));H.ring(cx,cy,4.6,P.color);H.sound('nova');H.shake(14);}
  else{for(let d=-1;d<=1;d++){addRow(cy+d);addCol(cx+d);}H.sound('beam');H.sound('nova');H.shake(12);}
  await blast([...set]);
}

/* ---------- turn flow ---------- */
function setTarget(p,i){const [x,y]=xy(i);p.tx=x;p.ty=y;p.speed=9;p.accel=0;}
function doSwap(a,b){const pa=G.cells[a],pb=G.cells[b];G.cells[a]=pb;G.cells[b]=pa;setTarget(pb,a);setTarget(pa,b);}
async function cascade(prefer=[]){
  G.combo=0;
  for(;;){
    if(G.pupQueue.length){const q=G.pupQueue.splice(0);for(const u of q){await pupPower(u.dog,u.i,true);await wait(60);collapse();await waitSettled();}continue;}
    const runs=findRuns();
    if(!runs.length){
      if(collectFish()){await wait(160);collapse();await waitSettled();continue;}
      break;
    }
    G.combo++;
    const groups=groupRuns(runs);const cells=new Set();const spawns=[];
    for(const g of groups){
      g.cells.forEach(c=>cells.add(c));const s=decideSpecial(g,prefer);if(s)spawns.push(s);
      if(G.boss&&!G.boss.released&&[...g.cells].some(nearBoss))feedBoss(g.cells.size);
    }
    for(const c of [...cells])for(const n of neigh(c)){const p=G.cells[n];if(p&&(p.kind==='boulder'||p.kind==='pup'))cells.add(n);}
    addFlux(groups.length*3+(G.combo-1)*6);
    H.sound('match',G.combo);H.buzz(8);if(G.combo>=2)H.cheer(G.combo>=4?'chain':'cascade',[...cells]);
    await blast([...cells],spawns);
    prefer=[];
    await wait(70);collapse();await waitSettled();
  }
  const c=G.combo;G.combo=0;return c;
}
async function attemptSwap(a,b){
  if(G.busy||!G.active||G.ended)return;
  const pa=G.cells[a],pb=G.cells[b];if(!movable(pa)||!movable(pb)||!adjacent(a,b))return;
  G.busy=true;G.sel=-1;H.clearHint();
  doSwap(a,b);H.sound('swap');await waitSettled();
  const pupAt=pa.kind==='pup'?b:pb.kind==='pup'?a:-1;
  if(pupAt>=0){if(G.mode!=='endless')G.moves--;H.hud();
    if(pa.kind==='pup')destroyAt(b);if(pb.kind==='pup')destroyAt(a);
    await cascade([b,a]);await endTurn(true);return;}
  const special=pa.kind==='prism'||pb.kind==='prism'||(isSpecial(pa)&&isSpecial(pb));
  if(!special&&!findRuns().length){
    doSwap(a,b);H.sound('nope');H.buzz(25);await waitSettled();
    G.busy=false;H.armHint();return;
  }
  if(G.mode!=='endless')G.moves--;H.hud();
  if(special){await comboSwap(a,b);await wait(60);collapse();await waitSettled();}
  await cascade([b,a]);
  await endTurn(true);
}
// Flux power (from Winter Lights on): the edge row on the chosen side spills off, gravity turns to face it.
async function tilt(dir){
  if(G.busy||!G.active||G.ended||G.flux<100||!DIRS[dir]||!G.level.gravityUnlocked)return false;
  G.busy=true;G.flux=0;G.sel=-1;H.clearHint();
  G.gravity=dir;H.sound('tilt');H.shake(10);H.buzz(30);H.hud();
  const edge=lineList().map(L=>L[0]).filter(i=>i!==undefined);
  await blast(edge,[],{spill:DIRS[dir]});
  await wait(80);collapse();await waitSettled();
  await cascade();await endTurn(false);
  return true;
}
/* ---------- the pups ----------
   Gypsy (fetch): proper and polite. She tidies the piece you choose and every touching piece of its kind.
   Zoya (dig): chaos. Zoomies from where you tap: a wild romp that knocks pieces out, scrambles the rest, skids in Beams.
   Marshall (bound): Super Marshall leaps along the row and lands with a bump. And he is her shadow: see endTurn.
   Cash (charge): sweet. Snuggles up, and every piece around the chosen one becomes its kind. */
function square(cx,cy,r){const o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=cx+dx,y=cy+dy;if(inb(x,y)&&G.valid[idx(x,y)])o.push(idx(x,y));}return o;}
function tidyCells(a){
  const p=G.cells[a];if(!p||p.kind!=='normal')return [a];
  const out=[a],seen=new Set([a]);
  for(let k=0;k<out.length;k++)for(const n of neigh(out[k])){if(seen.has(n))continue;seen.add(n);const q=G.cells[n];if(q&&q.kind==='normal'&&q.color===p.color)out.push(n);}
  return out;
}
// From a face tile she tidies every same-kind group touching her spot.
function tidyAround(a){const s=new Set();const [ax,ay]=xy(a);for(const n of square(ax,ay,1)){if(n===a)continue;const q=G.cells[n];if(q&&q.kind==='normal')tidyCells(n).forEach(i=>s.add(i));}return [...s];}
function zoomiesPath(a){
  const path=[a];let cur=a;
  for(let s=0;s<13;s++){const [x,y]=xy(cur);const opts=[];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(G.valid[j]&&!isFixed(j))opts.push(j);}
    if(!opts.length)break;const fresh=opts.filter(j=>!path.includes(j));const pool=fresh.length&&G.rng()<.8?fresh:opts;
    cur=pool[Math.floor(G.rng()*pool.length)];path.push(cur);}
  return path;
}
/* Dog powers play out slowly enough to enjoy. Times in ms; the UI hooks get the same numbers so sprites and pops stay in step. */
const PUP_T={tidyIn:420,zoomIn:320,zoomStep:110,jumble:190,leap:1150,land:220,sweep:75,snugIn:560,snugStep:130,snugOut:320};
// Pops groups one after another (a group pops together); specials met on the way go off at the end, as a normal blast.
async function popSeq(groups,step,onStep){
  const s0=G.score,chain=[],all=[];let k=0;
  for(const g of groups){let any=false;
    for(const i of g){all.push(i);if(!G.valid[i])continue;const p=G.cells[i];if(!p)continue;
      if(isSpecial(p)&&!p.activated){chain.push(i);continue;}destroyAt(i,onStep?onStep(i,k):null);any=true;}
    if(any){H.sound('pip',k);k++;}await wait(step);}
  const g=G.score-s0;if(g>0)H.text('+'+g,centroid(all));H.hud();
  if(chain.length)await blast(chain);
}
async function zoomies(a){
  const path=zoomiesPath(a),hit=[...new Set(path)];
  const near=new Set();for(const i of hit)for(const n of neigh(i))if(!hit.includes(n)){const q=G.cells[n];if(q&&q.kind==='normal')near.add(n);}
  const nn=[...near],cols=shuffleArr(nn.map(i=>G.cells[i].color),G.rng),beams=shuffleArr(nn.slice(),G.rng).slice(0,2).map(i=>[i,G.rng()<.5?'lineH':'lineV']);
  H.zoomies(path,PUP_T.zoomStep,PUP_T.zoomIn);H.shake(6);await wait(PUP_T.zoomIn);
  // she tears along her path, sending pieces flying the way she is running
  await popSeq(path.map(i=>[i]),PUP_T.zoomStep,(i,k)=>{if(k%3===0)H.shake(5);const pk=G.cells[i]&&G.cells[i].kind;if(pk==='boulder'||pk==='fish'||pk==='pup')return null;const j=path.indexOf(i),n=path[Math.min(path.length-1,j+1)],[x0,y0]=xy(i),[x1,y1]=xy(n);
    const dx=(x1-x0)||(G.rng()-.5),dy=(y1-y0)||(G.rng()-.5)-.6;return {spill:[dx*.9+(G.rng()-.5)*.6,dy*.9-.4]};});
  // then everything she brushed past gets jumbled, in three shoves
  const third=Math.ceil(nn.length/3);
  for(let s=0;s<3;s++){const part=nn.slice(s*third,(s+1)*third);if(!part.length)continue;
    part.forEach(i=>{const q=G.cells[i];if(q&&q.kind==='normal'){q.color=cols[nn.indexOf(i)];q.pop=1;}});H.shake(7);H.sound('swap');await wait(PUP_T.jumble);}
  for(const [i,k] of beams){const q=G.cells[i];if(q&&q.kind==='normal'){q.kind=k;q.pop=1;const [x,y]=xy(i);H.ring(x,y,.8,q.color);H.sound('forge');await wait(PUP_T.jumble);}}
}
function snuggleRing(a){const [x,y]=xy(a);return square(x,y,1).filter(i=>i!==a&&G.cells[i]&&G.cells[i].kind==='normal')
  .sort((i,j)=>{const [ix,iy]=xy(i),[jx,jy]=xy(j);return Math.atan2(iy-y,ix-x)-Math.atan2(jy-y,jx-x);});}
function snuggleColor(a,ring){const p=G.cells[a];let c=p&&p.kind==='normal'?p.color:-1;
  if(c<0){const cnt=new Array(6).fill(0);ring.forEach(i=>cnt[G.cells[i].color]++);c=cnt.indexOf(Math.max(...cnt));}return c;}
async function pupPower(tool,a,fromTile){
  const [x,y]=xy(a);H.cheer('dog:'+tool,[a]);
  if(tool==='fetch'){const p=G.cells[a];
    if(p&&p.kind==='fish'){H.tidy([a],300,PUP_T.tidyIn);await wait(PUP_T.tidyIn+300);await blast([a],[],{fetch:true});}
    else{// Gypsy is proper about it: she visits each piece in reading order and puts it away
      const cells=(fromTile?tidyAround(a):tidyCells(a)).filter(i=>G.cells[i]).sort((i,j)=>i-j);
      const step=Math.max(60,Math.min(140,1500/Math.max(1,cells.length)));
      H.tidy(cells,step,PUP_T.tidyIn);await wait(PUP_T.tidyIn);await popSeq(cells.map(i=>[i]),step);}}
  else if(tool==='dig')await zoomies(a);
  else if(tool==='bound'){// Super Marshall: wind up, one big leap, a bump where he lands, then the row rolls out from him
    H.leap(x,y,PUP_T.leap);await wait(PUP_T.leap);
    const sq=square(x,y,1);H.shake(12);H.ring(x,y,1.8,null);H.sound('boulder');await blast(sq);await wait(PUP_T.land);
    const row=rowCells(y).filter(i=>!sq.includes(i)),groups=[];
    for(const i of row){const d=Math.abs(xy(i)[0]-x);(groups[d]=groups[d]||[]).push(i);}
    const gs=groups.filter(Boolean);H.sweep(x,y,PUP_T.sweep,gs.length);H.sound('beam');await popSeq(gs,PUP_T.sweep);}
  else if(tool==='charge'){// Cash settles in, then the pieces around him come round to his side one by one
    const ring=snuggleRing(a),c=snuggleColor(a,ring);
    H.snuggle(x,y,PUP_T.snugIn+ring.length*PUP_T.snugStep+PUP_T.snugOut);await wait(PUP_T.snugIn);
    let k=0;for(const i of ring){const q=G.cells[i];if(q&&q.kind==='normal'){q.color=c;q.pop=1;const [qx,qy]=xy(i);H.ring(qx,qy,.55,c);H.sound('pip',k++);}await wait(PUP_T.snugStep);}
    H.sound('forge');await wait(PUP_T.snugOut);}
}
// The helper buttons. Free: they never cost a move and the arapaima does not take a turn.
async function useTool(tool,a){
  if(G.busy||!G.active||G.ended||!(G.tools[tool]>0)||a<0||!G.valid[a])return false;
  const pa=G.cells[a];
  if((tool==='fetch'||tool==='charge')&&(!pa||pa.kind==='boss'))return false;
  G.busy=true;G.tools[tool]--;G.sel=-1;H.clearHint();H.hud();H.sound('tool',tool);
  await pupPower(tool,a,false);
  await wait(60);collapse();await waitSettled();
  await cascade();await endTurn(false);
  return true;
}
async function overflow(){
  if(G.moves<=0||!isFinite(G.moves))return;
  H.banner('Overflow');H.sound('forge');await wait(900);
  while(G.moves>0){
    const n=Math.min(G.moves,5);G.moves-=n;H.hud();
    const picks=shuffleArr(G.cells.map((p,i)=>p&&p.kind==='normal'?i:-1).filter(i=>i>=0),G.rng).slice(0,n);
    for(const i of picks){const p=G.cells[i];p.kind=G.rng()<.5?'lineH':'lineV';p.pop=1;H.sound('forge');await wait(90);}
    await wait(250);await blast(picks);await wait(60);collapse();await waitSettled();await cascade();
  }
  for(let guard=0;guard<12;guard++){
    const sp=G.cells.map((p,i)=>isSpecial(p)?i:-1).filter(i=>i>=0);if(!sp.length)break;
    await blast(sp);await wait(60);collapse();await waitSettled();await cascade();
  }
}
async function shuffle(){
  H.banner('Reshuffle');await wait(700);
  const idxs=G.cells.map((p,i)=>p&&p.kind==='normal'?i:-1).filter(i=>i>=0);
  const cols=idxs.map(i=>G.cells[i].color);let ok=false;
  for(let t=0;t<300&&!ok;t++){shuffleArr(cols,G.rng);idxs.forEach((i,k)=>G.cells[i].color=cols[k]);ok=!findRuns().length&&!!findMove();}
  for(let t=0;t<300&&!ok;t++){idxs.forEach(i=>G.cells[i].color=randColor());ok=!findRuns().length&&!!findMove();}
  idxs.forEach(i=>G.cells[i].pop=1);H.shuffleFx();await wait(400);
  if(findRuns().length)await cascade();
  if(!findMove()&&G.level.gravityUnlocked)G.flux=100;
}
async function endTurn(consumed){
  G.combo=0;H.hud();
  if(consumed&&fishOnBoard()&&fishSwim()){await waitSettled();if(collectFish()){await wait(160);collapse();await waitSettled();}if(findRuns().length)await cascade();}
  if(G.boss&&!G.boss.released){
    if(consumed)await bossTurn();
    else if(G.boss.fed>=G.boss.need)await releaseBoss();
  }
  if(G.pendingGravity){G.gravity=G.pendingGravity;G.pendingGravity=null;H.gravity();}
  if(G.mode!=='endless'){
    if(goalsMet()){G.ended=true;await overflow();H.hud();H.win();return;}
    if(G.moves<=0){
      if(G.level.shadow&&!G.shadowUsed){G.shadowUsed=true;G.moves+=3;H.shadow();H.hud();}
      else{G.ended=true;H.lose();return;}
    }
  }
  if(!findMove())await shuffle();
  G.busy=false;H.hud();H.armHint();
}

const round50=v=>Math.max(50,Math.round(v/50)*50);
function chapterStart(ci){let s=0;for(let c=0;c<ci;c++)s+=CHAPTERS[c].count;return s;}
function chapterOf(n){
  if(n>STORY_TOTAL){const ch=Object.assign({},UNKNOWN,{pal:UNKNOWN_PALS[Math.floor((n-STORY_TOTAL-1)/10)%UNKNOWN_PALS.length]});return {ch,ci:CHAPTERS.length,idx:n-STORY_TOTAL};}
  let s=0;for(let c=0;c<CHAPTERS.length;c++){if(n<=s+CHAPTERS[c].count)return {ch:CHAPTERS[c],ci:c,idx:n-s};s+=CHAPTERS[c].count;}
  return {ch:CHAPTERS[0],ci:0,idx:1};
}
function heritageAt(n){
  const {ch,idx}=chapterOf(n);if(!ch.count)return ch.her[0];
  const t=ch.count>1?(idx-1)/(ch.count-1):0;return ch.her[0]+(ch.her[1]-ch.her[0])*t;
}
function dogsMetBefore(n){return DOGS.filter(d=>n>d.after);}
// Pup tiles start turning up after each dog's Gotcha Day blossom (the leaf after it joins).
function pupsFor(n){const dogs=dogsMetBefore(n).filter(d=>n>d.after+1).map(d=>d.tool);return dogs.length?{dogs,n:1,rate:.05,max:1}:null;}
function toolsFor(n){const t={};for(const d of dogsMetBefore(n))t[d.tool]=1;return t;}
function computeStars(L){
  const sg=L.goals.find(g=>g.t==='score');
  if(sg){L.s2=round50(sg.n*1.5);L.s3=round50(sg.n*2.1);}
  else{L.s2=round50(L.moves*120);L.s3=round50(L.moves*175);}
}
function normalizeLevel(def,n,extra){
  const {ch,idx}=chapterOf(n);
  const L=Object.assign({cols:8,rows:8,colors:ch.colors,gravity:'down',flux:0,tip:''},def,extra||{});
  L.layout=(def.layout||FULL).slice();L.goals=def.goals.map(g=>Object.assign({},g));L.num=n;L.chapter=ch;L.idx=idx;
  L.gravityUnlocked=!!ch.gravity;L.tools=L.tools||toolsFor(n);
  if(L.pups===undefined)L.pups=L.endless||L.daily?null:pupsFor(n);L.shadow=!!L.tools.bound&&!L.endless;
  L.crystalCount=0;L.boulderCount=0;L.patchCount=0;
  for(const row of L.layout)for(const ch2 of row){if(ch2==='1'||ch2==='2')L.crystalCount++;if(ch2==='o'||ch2==='O')L.boulderCount++;if(ch2==='p')L.patchCount++;}
  computeStars(L);return L;
}
// One generator for every non-hand-built level. Seeded by key, so the same key always yields the same level.
function generate(n,key,opt){
  const r=makeRng(hashStr(key));
  const pick=a=>a[Math.floor(r()*a.length)];
  const {ch,idx}=chapterOf(n);
  const maskNames=opt.masks||Object.keys(MASKS);
  const B=opt.beat||null;
  const mask=MASKS[B?B.mask:pick(maskNames)];
  const grid=[];for(let y=0;y<8;y++){grid.push([]);for(let x=0;x<8;x++)grid[y].push(mask&&mask[y][x]==='x'?'x':'.');}
  const colors=opt.colors;
  const tier=Math.min(1,Math.max(0,(n-12)/100));
  let types;
  if(B)types=B.types.slice();
  else{const primary=opt.forcePrimary||pick(opt.types);let secondary=null;
    if(opt.secondaryChance&&r()<opt.secondaryChance)secondary=pick(opt.types.concat(opt.extra||[]).filter(t=>t!==primary&&t!=='score'));
    types=[primary,secondary].filter(Boolean);}
  let moves=22+Math.floor(r()*5);
  const goals=[];const def={};
  if(types.includes('crystal')){
    const pat=B&&B.ice!=null?ICE_PATTERNS[B.ice]:pick(ICE_PATTERNS);const layer=B&&B.layer?B.layer:(n>30&&r()<0.3+tier*0.3)?'2':'1';let cnt=0;
    for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(grid[y][x]==='.'&&pat(x,y)){grid[y][x]=layer;cnt++;}
    if(!cnt){for(let y=3;y<5;y++)for(let x=3;x<5;x++)if(grid[y][x]==='.'){grid[y][x]='1';cnt++;}}
    if(cnt){moves+=Math.round(cnt*(layer==='2'?0.85:0.5))+2;goals.push({t:'crystal'});}
  }
  if(types.includes('patch')){
    const pat=B&&B.quilt!=null?QUILT_PATTERNS[B.quilt]:pick(QUILT_PATTERNS);let cnt=0;
    for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(grid[y][x]==='.'&&pat(x,y)){grid[y][x]='p';cnt++;}
    if(cnt){moves+=Math.round(cnt*0.42);goals.push({t:'patch'});}
  }
  if(types.includes('boulder')){
    const pairs=2+Math.floor(r()*3);let placed=0;
    for(let k=0;k<60&&placed<pairs;k++){
      const x=Math.floor(r()*4),y=Math.floor(r()*6);
      if(grid[y][x]!=='.'||grid[y][7-x]!=='.')continue;
      const c2=B&&B.hard?(placed%2?'O':'o'):(n>28&&r()<0.35+tier*0.3)?'O':'o';grid[y][x]=c2;grid[y][7-x]=c2;placed++;
    }
    if(placed){moves+=placed*2;goals.push({t:'boulder'});}
  }
  if(types.includes('fish')){
    const fn=B&&B.fish?B.fish:4+Math.floor(r()*4);def.fish={n:fn,max:r()<.5?2:3,rate:.13};goals.push({t:'fish',n:fn});moves+=Math.round(fn*1.2);
  }
  if(types.length>1)moves+=3;
  if(colors===6&&(types.includes('crystal')||types.includes('patch')))moves+=2;
  moves=Math.max(16,moves-Math.round(tier*4));
  if(types.includes('collect')){
    const two=B?!!B.two:types.length===1&&r()<0.6;const c1=Math.floor(r()*colors);const c2=(c1+1+Math.floor(r()*(colors-1)))%colors;
    const per=(two?0.8:1.0)*(colors===6?0.85:1);
    goals.push({t:'collect',c:c1,n:Math.round(moves*per)});
    if(two)goals.push({t:'collect',c:c2,n:Math.round(moves*per)});
  }
  if(types.includes('score')||!goals.length)goals.unshift({t:'score',n:round50(moves*(colors===6?70:85))});
  if(B&&B.bonus)moves+=B.bonus; // spare moves for awkward boards; goals were already sized above
  const gravity=B?(B.gravity||'down'):(opt.gravity&&r()<0.2)?pick(['up','left','right']):'down';
  return Object.assign(def,{moves,colors,gravity,goals,layout:grid.map(row=>row.join(''))});
}
function getLevel(n){
  if(n<=RAIN.length)return normalizeLevel(RAIN[n-1],n);
  if(n===STORY_TOTAL)return normalizeLevel(CROWN,n);
  const {ch,idx}=chapterOf(n);
  if(n<STORY_TOTAL){
    const quilt=ch.id==='home'&&n>=QUILT_FROM;
    const opt={beat:BEATS[ch.id]&&BEATS[ch.id][idx-1],types:ch.types,masks:ch.masks,colors:ch.colors,gravity:ch.gravity,
      secondaryChance:CHAPTERS.indexOf(ch)>=2?0.45:0.2,extra:ch.id==='snow'||ch.id==='sun'?['fish']:[],
      forcePrimary:quilt?'patch':(idx===1&&ch.id==='snow'?'crystal':idx===1&&ch.id==='sun'?'boulder':null)};
    const def=generate(n,'maria-level-'+n,opt);
    const tip=CHAPTER_TIPS[ch.id]&&CHAPTER_TIPS[ch.id][idx];
    if(tip)def.tip=tip;
    if(ch.id==='lights'&&idx===1)def.flux=100;
    if(idx===1)def.gravity='down';
    return normalizeLevel(def,n);
  }
  return normalizeLevel(generate(n,'maria-level-'+n,{types:['collect','crystal','boulder','fish','patch','score'],colors:6,gravity:true,secondaryChance:0.5}),n);
}
function dailyLevel(dateStr,metN){
  const n=Math.max(metN,STORY_TOTAL+1);
  const def=generate(n,'maria-daily-'+dateStr,{types:['collect','crystal','boulder','fish','patch','score'],colors:6,gravity:true,secondaryChance:0.5});
  return normalizeLevel(def,n,{tools:toolsFor(metN),daily:dateStr});
}
function endlessLevel(metN){
  return normalizeLevel({moves:Infinity,colors:5,goals:[]},Math.max(metN,STORY_TOTAL+1),{tools:toolsFor(metN),endless:true});
}

function rrPath(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// Specials wear their power on the outside: a lit track for a Beam, a sunburst for a Nova.
function drawSpecialAura(ctx,r,p,t){
  const col=SHAPE_COLORS[p.color]||'#fff';ctx.save();
  if(p.kind==='nova'){
    ctx.rotate(t*.9);ctx.fillStyle=col;ctx.globalAlpha=.75;
    for(let k=0;k<8;k++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(-r*.2,-r*.55);ctx.lineTo(0,-r*(1.08+.06*Math.sin(t*5+k)));ctx.lineTo(r*.2,-r*.55);ctx.closePath();ctx.fill();}
    ctx.globalAlpha=1;ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,r*.8,0,TAU);ctx.fill();
    ctx.fillStyle='#FFFDF8';ctx.beginPath();ctx.arc(0,0,r*.6,0,TAU);ctx.fill();
  }else{
    if(p.kind==='lineV')ctx.rotate(Math.PI/2);
    rrPath(ctx,-r*.98,-r*.6,r*1.96,r*1.2,r*.6);ctx.fillStyle=col;ctx.fill();
    ctx.save();rrPath(ctx,-r*.98,-r*.6,r*1.96,r*1.2,r*.6);ctx.clip();

    ctx.fillStyle='#FFFDF8';ctx.beginPath();ctx.arc(0,0,r*.5,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function drawBeamMark(ctx,r,vertical,t,col){

  for(const s of [1,-1]){ctx.beginPath();ctx.moveTo(s*(o+r*.3),0);ctx.lineTo(s*(o-r*.06),-r*.3);ctx.lineTo(s*(o-r*.06),r*.3);ctx.closePath();
    ctx.lineJoin='round';ctx.lineWidth=r*.08;ctx.strokeStyle=col||'#999';ctx.stroke();ctx.fillStyle='#FFFDF8';ctx.fill();}
  ctx.restore();
}
function drawNovaMark(ctx,r,t){

  for(let k=0;k<3;k++){const a=t*2.4+k*TAU/3;ctx.beginPath();ctx.arc(Math.cos(a)*r*.86,Math.sin(a)*r*.86,r*.12,0,TAU);ctx.fill();ctx.stroke();}

function drawPrism(ctx,r,t){

// Blockers read as heavy and in the way: a dark slab under them, a thick outline, and pips for hits left.

// The arapaima: a long river giant, olive at the head blushing red toward the tail.

function drawPieceAt(ctx,p,cx,cy,r,t,{scale=1,alpha=1,rot=0}={}){
  if(p.kind==='boss')return;
  ctx.save();ctx.translate(cx,cy);if(rot)ctx.rotate(rot);
  let sx=scale,sy=scale;
  if(p.land>0){const l=p.land*.14;if(G.gravity==='down'||G.gravity==='up'){sx*=1+l;sy*=1-l;}else{sx*=1-l;sy*=1+l;}}
  if(p.pop>0){const s=1+Math.sin(p.pop*Math.PI)*.35;sx*=s;sy*=s;}
  ctx.scale(sx,sy);ctx.globalAlpha=alpha;
  if(p.kind==='boulder')drawRock(ctx,r,p,p.mud?'#6B5A3E':(TH.rock||'#8A7A6A'));
  else if(p.kind==='prism')drawPrism(ctx,r,t);
  else if(p.kind==='pup')drawPup(ctx,r,p,t);
  else if(p.kind==='fish'){const a={down:Math.PI/2,up:-Math.PI/2,left:Math.PI,right:0}[G.gravity]||0;ctx.rotate(a);drawFish(ctx,r,t);}
  else if(p.kind==='lineH'||p.kind==='lineV'||p.kind==='nova'){
    drawSpecialAura(ctx,r,p,t);ctx.save();ctx.scale(p.kind==='nova'?.58:.48,p.kind==='nova'?.58:.48);drawShape(ctx,p.color,r);ctx.restore();
    if(p.kind==='nova')drawNovaMark(ctx,r,t);else drawBeamMark(ctx,r,p.kind==='lineV',t,SHAPE_COLORS[p.color]);}
  else drawShape(ctx,p.color,r);
  ctx.restore();
}

const iconCache={};
function makeIcon(spec,size=64){
  const key=JSON.stringify(spec)+size;if(iconCache[key])return iconCache[key];
  const prevSet=SET;if(spec.s)SET=PIECE_SETS[spec.s]||SET;
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const r=size*.42;
  const t0=0.6;
  if(spec.k==='crystal'){
    if((spec.cv||'ice')==='web'){x.fillStyle='rgba(60,45,80,.85)';rrPath(x,size*.1,size*.1,size*.8,size*.8,size*.16);x.fill();}
    drawCover(x,size*.1,size*.1,size*.8,size*.16,1,spec.cv||'ice',7);
  }else if(spec.k==='score'){
    x.save();x.translate(size/2,size/2);x.scale(r*1.05,r*1.05);x.fillStyle='#E59A3A';x.fill(STAR);x.restore();
  }else if(spec.k==='patch'){

    x.fillStyle=q[0];x.fillRect(0,0,w,w);x.fillStyle=q[1];x.beginPath();x.moveTo(0,0);x.lineTo(w,0);x.lineTo(w,w);x.closePath();x.fill();
    x.setLineDash([size*.05,size*.05]);x.strokeStyle='#fff';x.lineWidth=size*.04;x.strokeRect(size*.05,size*.05,w-size*.1,w-size*.1);x.restore();
  }else if(spec.k==='fish'){x.save();x.translate(size/2,size/2);drawFish(x,r*.95,0);x.restore();}
  else if(spec.k==='boss'){x.save();x.translate(size/2,size/2);drawArapaima(x,size*.29,0,1,0);x.restore();}
  else if(spec.k==='boulder'){const p=new Piece(-1,'boulder');x.save();x.translate(size/2,size/2);drawRock(x,r,p,spec.col||'#8A7A6A');x.restore();}
  else{const p=new Piece(spec.c??-1,spec.k);x.save();x.translate(size/2,size/2);drawPieceAt(x,p,0,0,r,t0);x.restore();}
  SET=prevSet;
  return iconCache[key]=c.toDataURL();
}

function drawPonds(c,t){
  if(!G.level.fish)return;

  for(const L of lineList()){const i=L[0];if(i===undefined)continue;const [x,y]=xy(i);
    const cx=pxX(x)+gx*(CS*.5+PAD*.5),cy=pxY(y)+gy*(CS*.5+PAD*.5);

  }
}

const FX=[],PARTS=[],DYING=[],FISHGO=[];let shakeAmt=0,leap=null;
function shards(cx,cy,color,n,spread=1){
  if(PARTS.length>500)return;
  for(let k=0;k<n;k++){const a=Math.random()*TAU,s=(110+Math.random()*230)*spread;
    PARTS.push({x:pxX(cx),y:pxY(cy),vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,life:0,max:.45+Math.random()*.35,
      size:CS*(.08+Math.random()*.08),rot:Math.random()*TAU,vr:(Math.random()-.5)*14,
      color:color||SHAPE_COLORS[Math.floor(Math.random()*6)]});}
}

// Each success calls out its own cheer where it happened. A cheer already on screen
// isn't repeated: it pops again and counts up (x2, x3) instead.
const CHEER_COLOR={cascade:2,chain:4,beam:3,nova:1,prism:4,combo:0,fish:1,goal:2,boss:0,dog:3,win:0};
const LIVE_CHEERS=new Map();let cheerSide=1;
H.cheer=(action,cells)=>{
  if(!G.level||G.instant)return;
  if(action.startsWith('dog:')){const d=DOGS.find(x=>x.tool===action.slice(4));floatCheer(d.line,DOGPAL[d.id]?DOGPAL[d.id].accent:SHAPE_COLORS[3],cells||[]);return;}
  floatCheer(cheerForLevel(G.level,action),SHAPE_COLORS[CHEER_COLOR[action]??2],cells||[]);
};
function cheerHtml(text,count){return esc(text)+(count>1?`<span class="x">\u00d7${count}</span>`:'');}
function floatCheer(text,color,cells){
  const now=performance.now(),live=LIVE_CHEERS.get(text);
  if(live){live.count++;live.seen=now;live.el.innerHTML=cheerHtml(text,live.count);return;}
  const wrap=$('#boardWrap'),wr=wrap.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  const k=(wr.width/wrap.offsetWidth)||1; // the screen may still be scaling in
  let cx=BW/2,cy=BH/2;
  if(cells.length){cx=0;cy=0;for(const i of cells){const [x,y]=xy(i);cx+=pxX(x);cy+=pxY(y);}cx/=cells.length;cy/=cells.length;}
  let X=(cr.left-wr.left)/k+cx,Y=(cr.top-wr.top)/k+cy;const Wd=wrap.offsetWidth;
  const el=document.createElement('div');el.className='cheer';el.innerHTML=cheerHtml(text,1);el.style.color=color||'var(--ink)';
  el.style.left=X+'px';el.style.top=Y+'px';wrap.appendChild(el);
  let w=el.offsetWidth;const maxW=Wd*.72;if(w>maxW){el.style.fontSize=Math.max(18,Math.floor(34*maxW/w))+'px';w=el.offsetWidth;}
  const h=el.offsetHeight;
  const left=Math.min(Math.max(X,w/2+14),Wd-w/2-14);el.style.left=left+'px';
  // don't stack on top of a cheer that is already showing
  for(let t=0;t<4;t++){let hit=false;for(const o of LIVE_CHEERS.values()){if(Math.abs(o.y-Y)<h&&Math.abs(o.x-left)<(o.w+w)/2){hit=true;break;}}if(!hit)break;Y+=h*1.05;}
  el.style.top=Y+'px';
  const dir=left<Wd*.34?1:left>Wd*.66?-1:(cheerSide=-cheerSide);
  const room=dir>0?Wd-14-(left+w/2):(left-w/2)-14;
  const dx=dir*Math.min(Math.max(room,0),30+Math.random()*60);
  const dy=-Math.min(Y-20,110+Math.random()*60),rot=dir*(2+Math.random()*5);
  const st={el,count:1,born:now,seen:now,x:left,y:Y,w};LIVE_CHEERS.set(text,st);
  const DRIFT=2600,HOLD=1500,FADE=1000;
  const step=t=>{
    const a=Math.min(1,(t-st.born)/DRIFT),e=1-Math.pow(1-a,2.2),since=t-st.seen;
    const pop=Math.min(1,(t-st.born)/150);
    const bump=since<260?Math.sin(since/260*Math.PI)*.16:0;
    const sc=(.45+.55*pop)*(1+bump)*(1-.05*a);
    const op=Math.min(pop*1.5,1)*(since<HOLD?1:Math.max(0,1-(since-HOLD)/FADE));
    st.x=left+dx*e;st.y=Y+dy*e;
    el.style.transform=`translate(-50%,-50%) translate(${(dx*e).toFixed(1)}px,${(dy*e).toFixed(1)}px) rotate(${(rot*e).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    el.style.opacity=op.toFixed(3);
    if(op>0||since<HOLD)requestAnimationFrame(step);else{el.remove();if(LIVE_CHEERS.get(text)===st)LIVE_CHEERS.delete(text);}
  };
  requestAnimationFrame(step);
}

let hintTimer=0;
H.armHint=()=>{clearTimeout(hintTimer);hintTimer=setTimeout(()=>{if(!G.busy&&G.active&&!G.ended&&curScreen==='game'&&!toolSel){const m=findMove();if(m)G.hint=m;}},7000);};

function updateFx(dt){
  for(let k=FX.length-1;k>=0;k--){FX[k].t+=dt;if(FX[k].t>=FX[k].life)FX.splice(k,1);}
  for(let k=PARTS.length-1;k>=0;k--){const p=PARTS[k];p.life+=dt;if(p.life>=p.max){PARTS.splice(k,1);continue;}
    p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let k=DYING.length-1;k>=0;k--){const d=DYING[k];d.t+=dt;if(d.t>=(d.spill?.6:.22)){DYING.splice(k,1);continue;}
    if(d.spill){const v=3+d.t*30;d.x+=d.spill[0]*v*dt;d.y+=d.spill[1]*v*dt;}}
  for(let k=FISHGO.length-1;k>=0;k--){const f=FISHGO[k];f.t+=dt;if(f.t>.7){FISHGO.splice(k,1);continue;}f.x+=f.gx*dt*2.2;f.y+=f.gy*dt*2.2;}
  if(leap){leap.t+=dt;if(leap.t>1.6)leap=null;}
  for(const p of G.cells){if(!p)continue;
    if(p.pop>0)p.pop=Math.max(0,p.pop-dt/.35);if(p.land>0)p.land=Math.max(0,p.land-dt/.18);if(p.hit>0)p.hit=Math.max(0,p.hit-dt/.3);}
  shakeAmt*=Math.pow(.002,dt);if(shakeAmt<.2)shakeAmt=0;
}
function isCalm(){
  if(FX.length||PARTS.length||DYING.length||FISHGO.length||leap||shakeAmt||G.hint||G.sel>=0||toolSel)return false;
  for(const p of G.cells)if(p&&(p.kind==='pup'||isSpecial(p)))return false;
  if(G.boss&&!G.boss.released)return false;
  for(const p of G.cells)if(p&&(p.x!==p.tx||p.y!==p.ty||p.pop||p.land||p.hit||p.kind==='fish'))return false;
  return true;
}

function render(t){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,BW,BH);
  if(shakeAmt)c.translate((Math.random()-.5)*shakeAmt,(Math.random()-.5)*shakeAmt);
  c.drawImage(bg,0,0,BW,BH);
  drawPonds(c,t);
  for(let i=0;i<G.patch.length;i++){const P=G.patch[i];if(!P)continue;const [x,y]=xy(i);
    const X=PAD+x*CS+3,Y=PAD+y*CS+3,S=CS-6;
    if(P===2){const q=TH.quilt||['#4A5BC4','#E77BA6','#E6B450'];const a=q[(x*2+y)%3],b2=q[(x+y*2+1)%3];
      c.fillStyle=a;rrPath(c,X,Y,S,S,CS*.12);c.fill();
      c.save();rrPath(c,X,Y,S,S,CS*.12);c.clip();c.fillStyle=b2;c.beginPath();
      if((x+y)%2){c.moveTo(X,Y);c.lineTo(X+S,Y);c.lineTo(X+S,Y+S);}else{c.moveTo(X,Y+S);c.lineTo(X,Y);c.lineTo(X+S,Y);}c.closePath();c.fill();c.restore();
      c.setLineDash([3,3]);c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.3;rrPath(c,X+3,Y+3,S-6,S-6,CS*.1);c.stroke();c.setLineDash([]);}
    else{c.fillStyle=TH.accent;c.globalAlpha=.14;rrPath(c,X+1,Y+1,S-2,S-2,CS*.14);c.fill();c.globalAlpha=1;c.setLineDash([5,3]);c.strokeStyle=TH.accent;c.lineWidth=2.2;rrPath(c,X+1,Y+1,S-2,S-2,CS*.14);c.stroke();c.setLineDash([]);}
  }
  // coverings sit under the piece, like a floor tile, so the piece on top always reads
  {const cv=coverOf(G.level);for(let i=0;i<G.crystal.length;i++){const L=G.crystal[i];if(!L)continue;const [x,y]=xy(i);
    drawCover(c,PAD+x*CS+2,PAD+y*CS+2,CS-4,CS*.16,L,cv,i);}}
  if(G.sel>=0&&G.cells[G.sel]){const [x,y]=xy(G.sel);c.strokeStyle=TH.ink;c.lineWidth=2.5;c.beginPath();c.arc(pxX(x),pxY(y),CS*.47,0,TAU);c.stroke();}
  if(toolSel&&toolSel.first>=0){const [x,y]=xy(toolSel.first);c.strokeStyle='#D9468A';c.lineWidth=3;c.beginPath();c.arc(pxX(x),pxY(y),CS*.47,0,TAU);c.stroke();}
  const hintIds=new Set();if(G.hint)for(const i of G.hint){const p=G.cells[i];if(p)hintIds.add(p.id);}
  const r=CS*.4;
  c.save();c.beginPath();c.rect(0,0,BW,BH);c.clip();
  for(const p of G.cells){if(!p)continue;
    const rot=hintIds.has(p.id)?Math.sin(t*14)*.16*(Math.sin(t*3)>0?1:.25):0;
    const sel=G.sel>=0&&G.cells[G.sel]===p?1.08:1;
    drawPieceAt(c,p,pxX(p.x),pxY(p.y),r,t,{rot,scale:sel});}
  if(G.boss&&!G.boss.released){const parts=bossCells().map(i=>G.cells[i]).filter(Boolean);
    if(parts.length===3){const x=(parts[0].x+parts[2].x)/2,y=parts[1].y;c.save();c.translate(pxX(x),pxY(y));
      drawArapaima(c,CS,t,G.boss.dir,G.boss.fed/G.boss.need);c.restore();
      const w=CS*2.2,bx=pxX(x)-w/2,by=pxY(y)-CS*.62;c.fillStyle='rgba(255,255,255,.75)';rrPath(c,bx,by,w,6,3);c.fill();
      c.fillStyle='#F2B705';rrPath(c,bx,by,Math.max(6,w*G.boss.fed/G.boss.need),6,3);c.fill();}}
  c.restore();
  for(const f of FISHGO){c.save();c.globalAlpha=1-f.t/.7;c.translate(pxX(f.x),pxY(f.y));const a={down:Math.PI/2,up:-Math.PI/2,left:Math.PI,right:0}[G.gravity]||0;c.rotate(a);drawFish(c,r,t);c.restore();}
  if(leap){const k=leap.t/1.6;c.save();c.globalAlpha=1-Math.max(0,k-.6)/.4;c.translate(pxX(leap.x),pxY(leap.y)-Math.sin(k*Math.PI)*CS*3);c.rotate((k-.5)*1.2*leap.dir);drawArapaima(c,CS,t,leap.dir,1);c.restore();}
  for(const d of DYING){
    if(d.spill){const k=d.t/.6;drawPieceAt(c,d.p,pxX(d.x),pxY(d.y),r,t,{alpha:1-k*k,scale:1-k*.3});}
    else{const k=d.t/.22;drawPieceAt(c,d.p,pxX(d.x),pxY(d.y),r,t,{alpha:1-k,scale:1+k*.4});}
  }
  for(const p of PARTS){const a=1-p.life/p.max;c.save();c.globalAlpha=a;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;
    c.beginPath();c.arc(0,-p.size*.5,p.size*.55,0,TAU);c.arc(0,p.size*.5,p.size*.55,0,TAU);c.fill();c.restore();}
  for(const f of FX){const k=f.t/f.life;c.save();
    if(f.type==='beam'){const a=1-k,th=CS*(.95*(1-k))+2;c.globalAlpha=a;
      if(f.dir==='h'){const y=pxY(f.y);c.fillStyle=f.color;c.fillRect(0,y-th/2,BW,th);c.fillStyle='#fff';c.fillRect(0,y-th/6,BW,th/3);}
      else{const x=pxX(f.x);c.fillStyle=f.color;c.fillRect(x-th/2,0,th,BH);c.fillStyle='#fff';c.fillRect(x-th/6,0,th/3,BH);}}
    else if(f.type==='ring'){const e=1-Math.pow(1-k,3);c.globalAlpha=1-k;c.strokeStyle=f.color;c.lineWidth=CS*.35*(1-k)+1;
      c.beginPath();c.arc(pxX(f.x),pxY(f.y),Math.max(1,f.R*CS*e),0,TAU);c.stroke();}
    else if(f.type==='rays'){c.globalAlpha=1-k;c.strokeStyle=f.color;c.lineWidth=3;c.lineCap='round';c.beginPath();
      for(const [tx,ty] of f.tos){c.moveTo(pxX(f.fx),pxY(f.fy));c.lineTo(pxX(f.fx)+(pxX(tx)-pxX(f.fx))*Math.min(1,k*3),pxY(f.fy)+(pxY(ty)-pxY(f.fy))*Math.min(1,k*3));}c.stroke();}
    else if(f.type==='paws'){const n=f.pts.length,shown=Math.min(n,Math.ceil(k*1.6*n));c.fillStyle=TH.ink;
      for(let j=0;j<shown;j++){const [px,py]=f.pts[j],[qx,qy]=f.pts[Math.min(n-1,j+1)];const age=k-j/(1.6*n);c.globalAlpha=Math.max(0,.55-age*.7);
        c.save();c.translate(pxX(px)+(j%2?CS*.12:-CS*.12),pxY(py));c.rotate(Math.atan2(qy-py,qx-px)+Math.PI/2);const s=CS*.11;
        c.beginPath();c.ellipse(0,s*.6,s,s*.8,0,0,TAU);c.fill();for(const [a,b] of [[-1.1,-.7],[-.4,-1.2],[.4,-1.2],[1.1,-.7]]){c.beginPath();c.arc(a*s,b*s,s*.38,0,TAU);c.fill();}c.restore();}}
    else if(f.type==='flydog'){ // Super Marshall: crouch at the edge, one big arc with a trail, squash on landing
      const img=pupImg('bound');const T=f.land,crouch=.28*T,tx=pxX(f.x),ty=pxY(f.y),sx=tx<BW/2?-CS*.2:BW+CS*.2,sy=BH-CS*.4,S=CS*1.5;
      const at=u=>{const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;return [sx+(tx-sx)*e,sy+(ty-sy)*e-Math.sin(u*Math.PI)*Math.max(CS*3,(sy-ty)*.5+CS*2)];};
      if(img.complete&&img.naturalWidth){
        if(f.t<crouch){const q=f.t/crouch;c.globalAlpha=Math.min(1,q*3);c.translate(sx+(tx>sx?CS*.4:-CS*.4)*q,sy);c.scale(1+.25*q,1-.3*q);c.drawImage(img,-S/2,-S,S,S);}
        else if(f.t<T){const u=(f.t-crouch)/(T-crouch);
          c.globalAlpha=.35*(1-u);c.fillStyle='#000';c.beginPath();c.ellipse(tx,ty+CS*.35,CS*.6*u,CS*.18*u,0,0,TAU);c.fill();
          for(let g=4;g>=1;g--){const v=Math.max(0,u-g*.05);const [gx,gy]=at(v);c.globalAlpha=.12*(5-g);c.drawImage(img,gx-S/2,gy-S/2,S,S);}
          const [X,Y]=at(u);c.globalAlpha=1;c.translate(X,Y);c.rotate((tx>sx?1:-1)*(u-.5)*.7);c.scale(1-.1*Math.sin(u*Math.PI),1+.12*Math.sin(u*Math.PI));c.drawImage(img,-S/2,-S/2,S,S);}
        else{const q=(f.t-T)/(f.life-T);c.globalAlpha=1-q;c.translate(tx,ty);c.scale(1+.3*(1-q),1-.3*(1-q));c.drawImage(img,-S/2,-S/2,S,S);}}}
    else if(f.type==='sweep'){ // the row rolls outward from where he landed
      const reach=Math.min(f.n,f.t/f.step)+.5,y=pxY(f.y),x=pxX(f.x),th=CS*.5,fade=f.t>f.n*f.step?1-(f.t-f.n*f.step)/(f.life-f.n*f.step):1;
      c.globalAlpha=.85*fade;c.fillStyle=TH.accent||'#E59A3A';c.fillRect(x-reach*CS,y-th/2,reach*CS*2,th);c.fillStyle='#fff';c.fillRect(x-reach*CS,y-th/8,reach*CS*2,th/4);}
    else if(f.type==='gypsy'){ // Gypsy walks to each piece in turn, neat and upright, and ticks it off
      const img=pupImg('fetch'),n=f.pts.length,S=CS*1.25,u=Math.max(0,f.t-f.intro)/f.step;

      if(img.complete&&img.naturalWidth){c.translate(X,Y);c.drawImage(img,-S/2,-S/2,S,S);}}

      for(let j=0;j<n;j++){const born=f.intro+j*f.step,age=f.t-born;if(age<0||age>1.4)continue;const [px,py]=f.pts[j],[qx,qy]=f.pts[Math.min(n-1,j+1)];
        c.save();c.globalAlpha=Math.max(0,.6-age*.43);c.fillStyle=TH.ink;c.translate(pxX(px)+(j%2?CS*.13:-CS*.13),pxY(py));c.rotate(Math.atan2(qy-py,qx-px)+Math.PI/2);const s=CS*.1;
        c.beginPath();c.ellipse(0,s*.6,s,s*.8,0,0,TAU);c.fill();for(const [a,b] of [[-1.1,-.7],[-.4,-1.2],[.4,-1.2],[1.1,-.7]]){c.beginPath();c.arc(a*s,b*s,s*.38,0,TAU);c.fill();}c.restore();}
      const run=f.t-f.intro;

      else if(run<n*f.step){const u=run/f.step,j=Math.min(n-1,Math.floor(u)),q=u-j,[x0,y0]=f.pts[j],[x1,y1]=f.pts[Math.min(n-1,j+1)];
        X=pxX(x0)+(pxX(x1)-pxX(x0))*q;Y=pxY(y0)+(pxY(y1)-pxY(y0))*q-Math.abs(Math.sin(q*Math.PI))*CS*.35;rot=Math.sin(u*2.7)*.55+(x1<x0?-.2:.2);sq=1+.15*Math.sin(q*Math.PI*2);
